version: "3"

vars:
  EXECUTABLE: ghost_editor

tasks:
  compile:
    cmds:
      - mix deps.get
      - mix deps.compile
      - TARGET_ABI=musl BURRITO_TARGET=linux MIX_ENV=prod mix release --overwrite
      - cp -rvf ./burrito_out/{{.EXECUTABLE}}_linux ./burrito_out/{{.EXECUTABLE | replace "_" "-"}}
      - sudo cp -rvf ./burrito_out/{{.EXECUTABLE | replace "_" "-"}} /usr/local/bin
    sources:
      - lib/**/*
    generates:
      - ./burrito_out/{{.EXECUTABLE}}_linux
      - ./burrito_out/{{.EXECUTABLE | replace "_" "-"}}
    status:
      - test -f burrito_out/{{.EXECUTABLE}}_linux
      - test -f burrito_out/{{.EXECUTABLE | replace "_" "-"}}

  compile:cleanup:
    cmds:
      - rm -rvf burrito_out
      - rm -rvf ~/.local/share/.burrito

  compile:run:
    cmds:
      - task: compile
      - sudo {{.EXECUTABLE | replace "_" "-"}}

  test:
    cmd: mix test.interactive lib

  cleanup:
    cmds:
      - mix deps.clean {{.CLI_ARGS}}
      - rm -rvf _build
      - rm -rvf .expert
