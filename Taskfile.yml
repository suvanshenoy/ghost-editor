version: "3"

vars:
  EXECUTABLE: ghost_editor

tasks:
  compile:
    cmds:
      - mix deps.get
      - mix deps.compile
      - TARGET_ABI=musl BURRITO_TARGET=linux MIX_ENV=prod mix release --overwrite
      - cp -rvf ./burrito_out/{{.EXECUTABLE}}_linux ./burrito_out/{{.EXECUTABLE | replace "_" "-"}}
      - sudo cp -rvf ./burrito_out/{{.EXECUTABLE | replace "_" "-"}} /usr/local/bin
    sources:
      - lib/**/*
    generates:
      - ./burrito_out/{{.EXECUTABLE}}_linux
      - ./burrito_out/{{.EXECUTABLE | replace "_" "-"}}
    status:
      - test -f burrito_out/ghosteditor_linux
      - test -f burrito_out/ghost-editor

  compile:cleanup:
    cmds:
      - rm -rvf burrito_out
      - rm -rvf ~/.local/share/.burrito

  compile:run:
    cmds:
      - task: compile
      - sudo ghost-editor

  cleanup:
    cmds:
      - mix deps.clean --all
      - rm -rvf _build
